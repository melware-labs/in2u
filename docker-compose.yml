# Levanta in2u completo: `docker compose up --build` y abrí http://localhost:8080
# (nginx sirve la web y reenvía /api al backend; el backend no se expone solo).
# Copiá .env.example a .env para configurar Google, Gemini, etc.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: in2u
      POSTGRES_USER: in2u
      POSTGRES_PASSWORD: ${DB_PASSWORD:-in2u}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U in2u -d in2u"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/in2u
      DB_USER: in2u
      DB_PASSWORD: ${DB_PASSWORD:-in2u}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-sin-configurar}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-sin-configurar}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_SEND_NOTES: ${GEMINI_SEND_NOTES:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${WEB_PORT:-8080}}
      DEV_LOGIN: ${DEV_LOGIN:-false}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 5

  web:
    build:
      context: ./web
      args:
        # Muestra el login de prueba en la pantalla de entrada (solo si DEV_LOGIN=true).
        VITE_DEV_LOGIN: ${DEV_LOGIN:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
