spring:
  application:
    name: in2u
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/in2u}
    username: ${DB_USER:in2u}
    password: ${DB_PASSWORD:in2u}
    # Sin conexiones fijas abiertas: así la base de Neon puede dormirse cuando nadie la usa
    # y no gasta sus horas gratis aunque el backend esté despierto todo el día.
    hikari:
      minimum-idle: 0
      idle-timeout: 60000 # 1 minuto
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:sin-configurar}
            client-secret: ${GOOGLE_CLIENT_SECRET:sin-configurar}
            scope: openid,profile,email
            # Detrás del proxy de Vercel, Spring vería el host de Render; en producción se fija a mano.
            redirect-uri: ${OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      # Limpia sesiones vencidas una vez al día (por defecto es cada minuto y no deja dormir a Neon).
      cleanup-cron: "0 0 4 * * *"
    timeout: 90d

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 90d
      cookie:
        name: JSESSIONID
        max-age: 90d
        same-site: lax
        # true en producción (https). En local con http debe ser false.
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # /actuator/health/liveness responde sin tocar la base: es la que usan Render y el ping externo.
      probes:
        enabled: true

in2u:
  # Adónde vuelve el navegador después de loguearse con Google (el frontend).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Login sin Google para probar en local. NUNCA activarlo en producción.
  dev-login: ${DEV_LOGIN:false}
  gemini:
    # API key gratuita de Google AI Studio (https://aistudio.google.com/apikey).
    # Sin key, los consejos se eligen igual con reglas según el ánimo.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-latest}
    # Las notas del check-in son íntimas y el plan gratuito de Google puede usar
    # los datos enviados: por defecto NO se mandan, solo los números del ánimo.
    send-notes: ${GEMINI_SEND_NOTES:false}
  push:
    public-key: ${VAPID_PUBLIC_KEY:BDVVs37Y7BvYqToBx4yJTgWEdwubgKuPp0iasXj9I2kSgayx5KOXV4poTZl9RyiLpOztxvk106FelnE5OZuv8Wc}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:hola@in2u.app}
