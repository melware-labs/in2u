# Sirve el frontend y reenvía la API al backend bajo el mismo origen, igual
# que harán los rewrites de Vercel: la cookie de sesión es de primera parte.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Para que Spring arme bien las URLs de redirección (login con Google).
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Tiempo real (SSE): sin buffer y con la conexión abierta.
  location = /api/mood/stream {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend:8080;
  }

  location /oauth2/ {
    proxy_pass http://backend:8080;
  }

  location /login/oauth2/ {
    proxy_pass http://backend:8080;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta devuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
